<!DOCTYPE html>
<html lang="en" ng-app="placementApp">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Placement Hub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background:#f4f6fb; }
  .kanban-col { background:#fff; border-radius:10px; min-height:200px; }
  .logo { width:40px; height:40px; border-radius:8px; background:#6f42c1; color:#fff;
          display:flex; align-items:center; justify-content:center; font-weight:700; }
</style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-3">
  <a class="navbar-brand" href="#!/">🎓 Campus Placement Hub</a>
  <div class="d-flex gap-2 align-items-center" ng-if="S.profile">
    <span class="text-light small">{{S.profile.full_name}} ({{S.profile.role}})</span>
    <a class="btn btn-sm btn-outline-light" ng-if="S.profile.role=='student'" href="#!/jobs">Jobs</a>
    <a class="btn btn-sm btn-outline-light" ng-if="S.profile.role=='student'" href="#!/my-applications">My Applications</a>
    <a class="btn btn-sm btn-outline-light" ng-if="S.profile.role=='student'" href="#!/profile">Profile</a>
    <a class="btn btn-sm btn-outline-light" ng-if="S.profile.role=='recruiter'" href="#!/recruiter/postings">Postings</a>
    <button class="btn btn-sm btn-danger" ng-click="S.logout()">Logout</button>
  </div>
</nav>

<div class="container py-4" ng-view></div>

<!-- LOGIN / SIGNUP -->
<script type="text/ng-template" id="login.html">

  <h4>{{mode=='login' ? 'Login' : 'Create account'}}</h4>
  <div class="alert alert-danger py-1" ng-if="err">{{err}}</div>
  <form ng-submit="submit()">
    <div ng-if="mode=='signup'">
      <select class="form-select mb-2" ng-model="f.role">
        <option value="student">Student</option><option value="recruiter">Recruiter</option></select>
      <input class="form-control mb-2" placeholder="Full name" ng-model="f.name" required>
      <input class="form-control mb-2" type="number" step="0.01" min="0" max="10" placeholder="CGPA" ng-model="f.cgpa" ng-if="f.role=='student'">
      <input class="form-control mb-2" placeholder="Company name" ng-model="f.company" ng-if="f.role=='recruiter'" required>
    </div>
    <input class="form-control mb-2" type="email" placeholder="Email" ng-model="f.email" required>
