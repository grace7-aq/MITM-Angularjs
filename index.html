
<!DOCTYPE html>
<html lang="en" ng-app="myApp">

<head>
    <meta charset="UTF-8">
    <title>MIT Mysore Student Registration</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
    <script src="app.js"></script>
</head>

<body>

    <div ng-controller="CollegeController">

        <h1>Welcome to {{collegeName}}</h1>
        <hr>

        <div ng-controller="StudentController">

            <h2>Student Registration</h2>

            <label>Student Name:</label>
            <input type="text" ng-model="name">
            <br><br>

            <label>Department:</label>
            <input type="text" ng-model="department">
            <br><br>

            <label>Semester:</label>
            <input type="number" ng-model="semester">
            <br><br>

            <button ng-click="addStudent()">
                Register Student
            </button>

            <hr>

            <h3>Student Details</h3>

            <p>Name: {{name}}</p>
            <p>Department: {{department}}</p>
            <p>Semester: {{semester}}</p>

            <hr>

            <h2>Registered Students</h2>

            <h2>Student List</h2>

            <ul>
                <li ng-repeat="student in students">
                    {{student}}
                </li>
            </ul>

        </div>

    </div>

</body>
</html>
